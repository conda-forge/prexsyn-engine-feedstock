schema_version: 1

context:
  version: 1.1.1

package:
  name: prexsyn-engine
  version: ${{ version }}

source:
  url: https://github.com/luost26/prexsyn-engine/archive/refs/tags/v${{ version }}.tar.gz
  sha256: cba542c19a035bb690f33436479672889a080dc59eff7c49e4ecb8243d0b92b8

build:
  skip:
    - osx and not arm64
    - match(python, "<3.10")
  number: 0
  script:
    - if: linux
      then: export CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER=${CXX} -DUSE_SYSTEM_BOOST=ON -DPREXSYN_OPENMP_ROOT=${PREFIX} ${CMAKE_ARGS}"
    - if: osx
      then: >-
        export CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER=${CXX}
        -DUSE_SYSTEM_BOOST=ON -DPREXSYN_OPENMP_ROOT=${PREFIX}
        -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
        -DCMAKE_THREAD_LIBS_INIT=-lpthread -DCMAKE_HAVE_THREADS_LIBRARY=1
        -DCMAKE_USE_WIN32_THREADS_INIT=0 -DCMAKE_USE_PTHREADS_INIT=1
        -DTHREADS_PREFER_PTHREAD_FLAG=ON ${CMAKE_ARGS}"
    - if: win
      then: set "CMAKE_ARGS=-G Ninja -DUSE_SYSTEM_BOOST=ON %CMAKE_ARGS%"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - git
    - ninja
  host:
    - python
    - scikit-build-core
    - pip
    - libboost-devel
    - if: osx
      then: llvm-openmp
  run:
    - python

tests:
  - python:
      imports:
        - prexsyn_engine
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/luost26/prexsyn-engine
  repository: https://github.com/luost26/prexsyn-engine
  documentation: https://prexsyn.readthedocs.io/
  summary: 'C++ backend library for PrexSyn with Python bindings'

extra:
  recipe-maintainers:
    - luost26
